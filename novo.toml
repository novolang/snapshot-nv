[package]
name        = "snapshot-nv"
version     = "0.0.2"
description = "Snapshot assertions for novo-lang: the stored file is a two-line-delimited header and then the value verbatim, the comparison ANSWERS a SnapVerdict instead of raising, and the update policy is a value the runner passes rather than an environment variable read inside the assertion — so one run can compare one suite and accept another, and the library can be tested by the library.  Mismatches render through diff-nv and land in a `.new` file beside the snapshot.  Interface only — every body is a todo()."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `host`, and the row that matters is the one that is NOT here.
#
# `[fs]` is reading the stored snapshot, writing a `.new` beside it and
# listing the pending ones.  `[io]` appears on exactly two functions:
# `snappolicy.policy_from_env`, which reads the one environment
# variable, and `snapassert.assert_snapshot`, which reports through
# `std.test`.  Every comparison, every render and the whole file format
# are `[]`.
#
# The consequence is the design: `snapassert.check` is `[fs]` and
# answers a verdict, so a runner decides what a mismatch means, a
# review tool is built over the same call, and a test OF this package
# needs no environment at all.
layer       = "host"

category    = "testing"

tags        = ["snapshot", "insta", "syrupy", "approval-testing", "golden", "testing", "diff"]
repository  = "https://github.com/novolang/snapshot-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A verdict instead of an assertion, and a policy instead of an environment variable"

[dependencies]
# The mismatch rendering, and nothing else.
#
# `snapassert.render_diff` tokenises both sides by line, walks them and
# renders a unified diff — three calls into diff-nv and no algorithm of
# this package's own.  diff-nv is `core`, which the layer order allows,
# and the dependency is one-directional on purpose: a snapshot is text
# and a diff is arithmetic over text, so nothing here belongs in
# diff-nv and nothing there needs a file.
#
# diff-nv is itself an interface release today, so this dependency is
# an interface depending on an interface — which resolves, downloads
# and builds exactly like any other, and panics at the first call.
diff-nv = "^0.0.1"
